services:
  postgres:
    image: postgres:16-alpine
    container_name: movie-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movie_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie_search}
      POSTGRES_DB: ${POSTGRES_DB:-movie_search}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movie_search} -d ${POSTGRES_DB:-movie_search}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
